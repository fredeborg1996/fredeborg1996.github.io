<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#152333"><title>Bastion Defense</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#152333;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:manipulation}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:0;color:#fff;font-weight:800;text-shadow:0 2px 3px #000b;pointer-events:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:6px;right:6px;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:5px}.chip{background:#0b121bdc;border:1px solid #ffffff30;border-radius:11px;padding:6px;text-align:center;font-size:12px}.bar{height:6px;background:#0008;border-radius:5px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:#57dc75}.bar.xp i{background:#5ba5ff}.center{position:absolute;top:calc(env(safe-area-inset-top) + 61px);left:50%;transform:translateX(-50%);font-size:15px;background:#0b121bbb;padding:5px 10px;border-radius:10px;white-space:nowrap}#shop{position:absolute;left:0;right:0;bottom:0;pointer-events:auto;background:#0b121bf2;border-top:1px solid #ffffff32;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}.shopTitle{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:0 3px 6px;color:#cbd7e5;text-shadow:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.btn{min-height:57px;border:1px solid #ffffff30;border-radius:12px;padding:7px 4px;background:#1a2a3b;color:#fff;font-weight:900;font-size:12px;line-height:1.12}.btn small{display:block;font-size:10px;color:#ffd365;margin-top:4px}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}#start{grid-column:1/-1;min-height:43px;background:#e5aa3e;color:#25190a;font-size:15px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#081018df;pointer-events:auto}.card{width:min(88vw,420px);background:#172535;border:1px solid #ffffff30;border-radius:20px;padding:22px;text-align:center}.card h1{margin:0 0 8px}.card p{line-height:1.4;color:#dbe4ee}.card button{border:0;border-radius:13px;padding:13px 20px;background:#f0b34a;font-weight:1000;font-size:18px}.hidden{display:none!important}.toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:#101923e8;border:1px solid #ffffff38;border-radius:12px;padding:8px 12px;font-size:13px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="chip">🪙 <span id="gold">120</span></div><div class="chip">BASE <span id="hpText">100/100</span><div class="bar"><i id="hpBar"></i></div></div><div class="chip">LV <span id="lvl">1</span><div class="bar xp"><i id="xpBar"></i></div></div></div><div class="center">WAVE <span id="wave">1</span> · <span id="left">0</span> tilbage</div><div id="toast" class="toast"></div><div id="shop"><div class="shopTitle"><span>Forsvarere: 🏹 <b id="archerCount">1</b> · 🔮 <b id="mageCount">0</b></span><span>Køb også under wave</span></div><div class="grid"><button class="btn" id="buyArcher">🏹 Ny skytte<small><span id="archerCost">50</span> guld</small></button><button class="btn" id="buyMage">🔮 Magiker<small><span id="mageCost">130</span> guld</small></button><button class="btn" id="upDamage">⚔️ Skade +25%<small><span id="damageCost">80</span> guld</small></button><button class="btn" id="upRate">⚡ Tempo +15%<small><span id="rateCost">100</span> guld</small></button><button class="btn" id="repair">🛠 Reparer<small><span id="repairCost">40</span> guld</small></button><button class="btn" id="fortify">🧱 Mere HP<small><span id="fortifyCost">120</span> guld</small></button><button class="btn" id="start">Start wave</button></div></div><div id="overlay" class="overlay"><div class="card"><h1>BASTION DEFENSE</h1><p>Forsvar muren, køb flere skytter og opgrader basen. Køb virker både før og under en wave.</p><button id="play">Start spil</button></div></div><div id="gameover" class="overlay hidden"><div class="card"><h1>BASTIONEN FALDT</h1><p>Du nåede wave <span id="finalWave">1</span>.</p><button id="restart">Start forfra</button></div></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),E=id=>document.getElementById(id);let W,H,D=1,last=0,shopH=205;let gold=120,wave=1,level=1,xp=0,xpNeed=100,baseHP=100,baseMax=100;let archers=1,mages=0,damageMul=1,rateMul=1,enemies=[],shots=[],parts=[];let active=false,spawning=false,spawnLeft=0,spawnTimer=0;let archerCost=50,mageCost=130,damageCost=80,rateCost=100,repairCost=40,fortifyCost=120;const clocksA=[],clocksM=[],rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const wallY=()=>Math.min(H-shopH-82,H*.61);function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;shopH=E('shop').offsetHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);setTimeout(resize,0);function toast(s){const t=E('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),900)}function hud(){E('gold').textContent=Math.floor(gold);E('hpText').textContent=Math.max(0,Math.ceil(baseHP))+'/'+baseMax;E('hpBar').style.width=clamp(baseHP/baseMax*100,0,100)+'%';E('lvl').textContent=level;E('xpBar').style.width=clamp(xp/xpNeed*100,0,100)+'%';E('wave').textContent=wave;E('left').textContent=enemies.filter(e=>!e.dead).length+spawnLeft;E('archerCount').textContent=archers;E('mageCount').textContent=mages;for(const [id,v] of [['archerCost',archerCost],['mageCost',mageCost],['damageCost',damageCost],['rateCost',rateCost],['repairCost',repairCost],['fortifyCost',fortifyCost]])E(id).textContent=v;E('start').textContent=active?'Wave i gang...':'Start wave';E('start').disabled=active}function buy(cost,fn,name){if(gold<cost){toast('Ikke nok guld');return}gold-=cost;fn();toast(name+' købt');hud()}E('buyArcher').onclick=()=>buy(archerCost,()=>{archers++;archerCost=Math.ceil(archerCost*1.32)},'Skytte');E('buyMage').onclick=()=>buy(mageCost,()=>{mages++;mageCost=Math.ceil(mageCost*1.42)},'Magiker');E('upDamage').onclick=()=>buy(damageCost,()=>{damageMul*=1.25;damageCost=Math.ceil(damageCost*1.48)},'Skade');E('upRate').onclick=()=>buy(rateCost,()=>{rateMul*=1.15;rateCost=Math.ceil(rateCost*1.48)},'Tempo');E('repair').onclick=()=>{if(baseHP>=baseMax){toast('Basen har fuldt liv');return}buy(repairCost,()=>{baseHP=Math.min(baseMax,baseHP+35);repairCost=Math.ceil(repairCost*1.15)},'Reparation')};E('fortify').onclick=()=>buy(fortifyCost,()=>{baseMax+=35;baseHP+=35;fortifyCost=Math.ceil(fortifyCost*1.5)},'Forstærkning');E('start').onclick=startWave;E('play').onclick=()=>E('overlay').classList.add('hidden');E('restart').onclick=()=>location.reload();function startWave(){if(active)return;active=spawning=true;spawnLeft=8+wave*4;spawnTimer=.15;hud()}function spawn(){const boss=wave%5===0&&spawnLeft===1,brute=Math.random()<Math.min(.12+wave*.012,.38);let hp=(20+wave*8)*rnd(.85,1.15),speed=18+wave*1.25,reward=8+wave*2,r=11;if(brute){hp*=2.7;speed*=.62;reward*=2.3;r=17}if(boss){hp*=8;speed*=.5;reward*=8;r=27}enemies.push({x:rnd(25,W-25),y:-25,hp,max:hp,speed,reward,r,boss,brute,dead:false,attack:0})}function gainXP(v){xp+=v;while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.ceil(xpNeed*1.28);damageMul*=1.08;baseMax+=10;baseHP=Math.min(baseMax,baseHP+15);toast('LEVEL '+level+'!')}}function target(){let t=null,b=-1;for(const e of enemies)if(!e.dead&&e.y>b){b=e.y;t=e}return t}function fire(dt){const t=target();if(!t)return;const y=wallY()-35;for(let i=0;i<archers;i++){clocksA[i]=(clocksA[i]||0)-dt;if(clocksA[i]<=0){const px=(i+1)*W/(archers+1);shots.push({x:px,y,tx:t.x,ty:t.y,v:430,damage:12*damageMul,type:'arrow',target:t});clocksA[i]=1/(1.2*rateMul)}}for(let i=0;i<mages;i++){clocksM[i]=(clocksM[i]||0)-dt;if(clocksM[i]<=0){const px=(i+1)*W/(mages+1);shots.push({x:px,y:y-34,tx:t.x,ty:t.y,v:310,damage:28*damageMul,type:'magic',target:t,splash:38});clocksM[i]=1/(.55*rateMul)}}}function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-70,70),vy:rnd(-90,20),l:rnd(.25,.55),r:rnd(2,4),c:col})}function hit(s){if(!s.target||s.target.dead)return;s.target.hp-=s.damage;if(s.splash)for(const e of enemies)if(!e.dead&&Math.hypot(e.x-s.target.x,e.y-s.target.y)<s.splash)e.hp-=s.damage*.45;burst(s.target.x,s.target.y,s.type==='magic'?'#a987ff':'#ffd36b',7)}function update(dt){if(active){if(spawning){spawnTimer-=dt;if(spawnTimer<=0&&spawnLeft>0){spawn();spawnLeft--;spawnTimer=Math.max(.18,.6-wave*.014)}if(spawnLeft<=0)spawning=false}fire(dt);for(const e of enemies){if(e.dead)continue;if(e.y<wallY()-22)e.y+=e.speed*dt;else{e.attack-=dt;if(e.attack<=0){baseHP-=e.boss?12:e.brute?6:3;e.attack=.65;burst(e.x,wallY()-8,'#ff604e',9);if(baseHP<=0){baseHP=0;active=false;E('finalWave').textContent=wave;E('gameover').classList.remove('hidden')}}}if(e.hp<=0){e.dead=true;gold+=e.reward;gainXP(e.boss?60:e.brute?22:8);burst(e.x,e.y,'#76dc68',13)}}for(const s of shots){if(!s.target||s.target.dead){s.dead=true;continue}const dx=s.target.x-s.x,dy=s.target.y-s.y,d=Math.hypot(dx,dy),step=s.v*dt;if(d<=step){hit(s);s.dead=true}else{s.x+=dx/d*step;s.y+=dy/d*step}}shots=shots.filter(s=>!s.dead);if(!spawning&&enemies.every(e=>e.dead)&&active){active=false;gold+=25+wave*8;wave++;baseHP=Math.min(baseMax,baseHP+10);toast('Wave klaret!')}}for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}parts=parts.filter(p=>p.l>0);hud()}function bg(){let g=ctx.createLinearGradient(0,0,0,wallY());g.addColorStop(0,'#101923');g.addColorStop(1,'#30465e');ctx.fillStyle=g;ctx.fillRect(0,0,W,wallY());ctx.fillStyle='#5a4637';ctx.fillRect(0,wallY(),W,H-wallY());ctx.fillStyle='#7c8794';ctx.fillRect(0,wallY()-22,W,29);for(let xx=0;xx<W;xx+=38){ctx.fillStyle=xx%76===0?'#9aa3ae':'#707b87';ctx.fillRect(xx,wallY()-48,26,27)}}function defenders(){for(let i=0;i<archers;i++){const px=(i+1)*W/(archers+1),y=wallY()-40;ctx.fillStyle='#48a8ff';ctx.beginPath();ctx.arc(px,y,8,0,7);ctx.fill();ctx.fillRect(px-5,y+6,10,16);ctx.strokeStyle='#e2bd70';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px+8,y+8,8,-1.2,1.2);ctx.stroke()}for(let i=0;i<mages;i++){const px=(i+1)*W/(mages+1),y=wallY()-76;ctx.fillStyle='#a76cff';ctx.beginPath();ctx.arc(px,y,9,0,7);ctx.fill();ctx.fillRect(px-5,y+7,10,17);ctx.fillStyle='#e3d5ff';ctx.beginPath();ctx.arc(px+10,y+2,4,0,7);ctx.fill()}}function monsters(){for(const e of enemies){if(e.dead)continue;ctx.fillStyle=e.boss?'#db3c2c':e.brute?'#b64b38':'#6eb94b';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(e.x-e.r*.3,e.y-e.r*.15,2,0,7);ctx.arc(e.x+e.r*.3,e.y-e.r*.15,2,0,7);ctx.fill();ctx.fillStyle='#170b0b';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,5);ctx.fillStyle='#ef4f3f';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.max),5)}}function draw(){bg();monsters();for(const s of shots){ctx.fillStyle=s.type==='magic'?'#c19cff':'#ffd36b';ctx.beginPath();ctx.arc(s.x,s.y,s.type==='magic'?5:3,0,7);ctx.fill()}defenders();for(const p of parts){ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop)})();</script></body></html>
