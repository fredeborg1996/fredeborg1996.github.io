<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#182330"><title>Bastion Defense</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182330;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;font-weight:800;text-shadow:0 2px 3px #000b}.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.chip{background:#0c1118d9;border:1px solid #ffffff35;border-radius:13px;padding:7px 8px;text-align:center;font-size:13px}.bar{height:7px;background:#0008;border-radius:5px;margin-top:4px;overflow:hidden}.bar>i{display:block;height:100%;background:#56dc75;width:100%}.bar.xp>i{background:#62a8ff}.center{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);font-size:18px;white-space:nowrap}.panel{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:repeat(2,1fr);gap:8px;pointer-events:auto}.btn{border:1px solid #ffffff38;border-radius:14px;padding:10px 8px;background:#1a2634e8;color:#fff;font-weight:900;font-size:14px;box-shadow:0 4px 10px #0006}.btn small{display:block;font-size:11px;opacity:.8;margin-top:2px}.btn:active{transform:scale(.98)}#start,#next{grid-column:1/-1;background:#e4a83d;color:#21170a;font-size:17px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#081018d9;pointer-events:auto}.card{width:min(88vw,420px);background:#172331;border:1px solid #ffffff33;border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 50px #0009}.card h1{margin:0 0 8px;font-size:30px}.card p{margin:8px 0 18px;line-height:1.4;color:#d9e1ea}.card button{border:0;border-radius:14px;padding:13px 20px;background:#f0b34a;color:#21170a;font-weight:1000;font-size:18px}.hidden{display:none!important}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="chip">🪙 <span id="gold">80</span></div><div class="chip">BASE <span id="hpText">100/100</span><div class="bar"><i id="hpBar"></i></div></div><div class="chip">LV <span id="lvl">1</span><div class="bar xp"><i id="xpBar"></i></div></div></div><div class="center">WAVE <span id="wave">1</span> · <span id="left">0</span> tilbage</div><div class="panel"><button class="btn" id="buyArcher">🏹 Køb skytte<small><span id="archerCost">60</span> guld</small></button><button class="btn" id="buyMage">🔮 Køb magiker<small><span id="mageCost">140</span> guld</small></button><button class="btn" id="upDamage">⚔️ Skade +25%<small><span id="damageCost">90</span> guld</small></button><button class="btn" id="upRate">⚡ Tempo +15%<small><span id="rateCost">110</span> guld</small></button><button class="btn" id="repair">🛠 Reparer base<small><span id="repairCost">45</span> guld</small></button><button class="btn" id="fortify">🧱 Forstærk base<small><span id="fortifyCost">130</span> guld</small></button><button class="btn" id="start">Start wave</button></div><div id="overlay" class="overlay"><div class="card"><h1>BASTION DEFENSE</h1><p>Forsvar muren mod bølger af monstre. Køb skytter, magikere og permanente opgraderinger mellem bølgerne.</p><button id="play">Start spil</button></div></div><div id="gameover" class="overlay hidden"><div class="card"><h1>BASTIONEN FALDT</h1><p>Du nåede wave <span id="finalWave">1</span>.</p><button id="restart">Start forfra</button></div></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),E=id=>document.getElementById(id);let W,H,D=1,last=0;let gold=80,wave=1,level=1,xp=0,xpNeed=100,baseHP=100,baseMax=100;let archers=1,mages=0,damageMul=1,rateMul=1;let enemies=[],shots=[],parts=[];let active=false,spawning=false,spawnLeft=0,spawnTimer=0,waveTotal=0;let archerCost=60,mageCost=140,damageCost=90,rateCost=110,repairCost=45,fortifyCost=130;const wallY=()=>H*.72;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function hud(){E('gold').textContent=Math.floor(gold);E('hpText').textContent=Math.max(0,Math.ceil(baseHP))+'/'+baseMax;E('hpBar').style.width=clamp(baseHP/baseMax*100,0,100)+'%';E('lvl').textContent=level;E('xpBar').style.width=clamp(xp/xpNeed*100,0,100)+'%';E('wave').textContent=wave;E('left').textContent=enemies.filter(e=>!e.dead).length+spawnLeft;E('archerCost').textContent=archerCost;E('mageCost').textContent=mageCost;E('damageCost').textContent=damageCost;E('rateCost').textContent=rateCost;E('repairCost').textContent=repairCost;E('fortifyCost').textContent=fortifyCost;E('start').textContent=active?'Wave i gang...':'Start wave'}function buy(cost,fn){if(active||gold<cost)return;gold-=cost;fn();hud()}E('buyArcher').onclick=()=>buy(archerCost,()=>{archers++;archerCost=Math.ceil(archerCost*1.35)});E('buyMage').onclick=()=>buy(mageCost,()=>{mages++;mageCost=Math.ceil(mageCost*1.45)});E('upDamage').onclick=()=>buy(damageCost,()=>{damageMul*=1.25;damageCost=Math.ceil(damageCost*1.5)});E('upRate').onclick=()=>buy(rateCost,()=>{rateMul*=1.15;rateCost=Math.ceil(rateCost*1.5)});E('repair').onclick=()=>buy(repairCost,()=>{baseHP=Math.min(baseMax,baseHP+35);repairCost=Math.ceil(repairCost*1.18)});E('fortify').onclick=()=>buy(fortifyCost,()=>{baseMax+=35;baseHP+=35;fortifyCost=Math.ceil(fortifyCost*1.55)});E('start').onclick=startWave;E('play').onclick=()=>E('overlay').classList.add('hidden');E('restart').onclick=()=>location.reload();function startWave(){if(active)return;active=true;spawning=true;waveTotal=8+wave*4;spawnLeft=waveTotal;spawnTimer=.2;hud()}function spawn(){const boss=wave%5===0&&spawnLeft===1;const brute=Math.random()<Math.min(.12+wave*.01,.35);let hp=(22+wave*8)*rnd(.85,1.15),speed=18+wave*1.2,reward=7+wave*2,r=11;if(brute){hp*=2.8;speed*=.62;reward*=2.4;r=17}if(boss){hp*=8;speed*=.5;reward*=8;r=27}enemies.push({x:rnd(25,W-25),y:-30,hp,max:hp,speed,reward,r,boss,brute,dead:false,attack:0})}function gainXP(v){xp+=v;while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.ceil(xpNeed*1.28);damageMul*=1.08;baseMax+=10;baseHP=Math.min(baseMax,baseHP+15)}}function target(){let t=null,b=-1;for(const e of enemies)if(!e.dead&&e.y>b){b=e.y;t=e}return t}function fire(dt){const t=target();if(!t)return;const baseY=wallY()-18;for(let i=0;i<archers;i++){const interval=1/(1.2*rateMul);shootClocksA[i]=(shootClocksA[i]||0)-dt;if(shootClocksA[i]<=0){const x=(i+1)*W/(archers+1);shots.push({x,y:baseY,tx:t.x,ty:t.y,v:420,damage:12*damageMul,type:'arrow',target:t});shootClocksA[i]=interval}}for(let i=0;i<mages;i++){const interval=1/(.55*rateMul);shootClocksM[i]=(shootClocksM[i]||0)-dt;if(shootClocksM[i]<=0){const x=(i+1)*W/(mages+1);shots.push({x,y:baseY-30,tx:t.x,ty:t.y,v:300,damage:28*damageMul,type:'magic',target:t,splash:34});shootClocksM[i]=interval}}}const shootClocksA=[],shootClocksM=[];function hit(s){if(!s.target||s.target.dead)return;s.target.hp-=s.damage;if(s.splash){for(const e of enemies)if(!e.dead&&Math.hypot(e.x-s.target.x,e.y-s.target.y)<s.splash)e.hp-=s.damage*.45}burst(s.target.x,s.target.y,s.type==='magic'?'#9f73ff':'#ffd36b',8)}function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-70,70),vy:rnd(-90,20),l:rnd(.25,.55),r:rnd(2,4),c:col})}function update(dt){if(active){if(spawning){spawnTimer-=dt;if(spawnTimer<=0&&spawnLeft>0){spawn();spawnLeft--;spawnTimer=Math.max(.18,.62-wave*.015)}if(spawnLeft<=0)spawning=false}fire(dt);for(const e of enemies){if(e.dead)continue;if(e.y<wallY()-20)e.y+=e.speed*dt;else{e.attack-=dt;if(e.attack<=0){baseHP-=e.boss?12:e.brute?6:3;e.attack=.65;burst(e.x,wallY()-5,'#ff5f4b',10);if(baseHP<=0){baseHP=0;active=false;E('finalWave').textContent=wave;E('gameover').classList.remove('hidden')}}}if(e.hp<=0&&!e.dead){e.dead=true;gold+=e.reward;gainXP(10+(e.boss?60:e.brute?22:8));burst(e.x,e.y,'#7cdf66',14)}}for(const s of shots){const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy),step=s.v*dt;if(d<=step||!s.target||s.target.dead){hit(s);s.dead=true}else{s.x+=dx/d*step;s.y+=dy/d*step;s.tx=s.target.x;s.ty=s.target.y}}shots=shots.filter(s=>!s.dead);enemies=enemies.filter(e=>!e.dead||e.y<H+50);if(!spawning&&enemies.every(e=>e.dead)&&active){active=false;gold+=25+wave*8;wave++;baseHP=Math.min(baseMax,baseHP+10);hud()}}for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}parts=parts.filter(p=>p.l>0);hud()}function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101923');g.addColorStop(.58,'#243448');g.addColorStop(1,'#5c4636');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#18293a';for(let i=0;i<18;i++){ctx.beginPath();ctx.arc((i*83)%W,(i*61)%Math.max(120,wallY()-120),2+(i%3),0,7);ctx.fill()}ctx.fillStyle='#5a4637';ctx.fillRect(0,wallY(),W,H-wallY());ctx.fillStyle='#7b8491';ctx.fillRect(0,wallY()-22,W,28);for(let x=0;x<W;x+=38){ctx.fillStyle=x%76===0?'#929aa5':'#707985';ctx.fillRect(x,wallY()-46,26,25)}}function drawDefenders(){for(let i=0;i<archers;i++){const x=(i+1)*W/(archers+1),y=wallY()-38;ctx.fillStyle='#4aa5ff';ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fill();ctx.fillRect(x-5,y+6,10,15);ctx.strokeStyle='#d6b56d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+8,y+8,8,-1.2,1.2);ctx.stroke()}for(let i=0;i<mages;i++){const x=(i+1)*W/(mages+1),y=wallY()-72;ctx.fillStyle='#a86cff';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();ctx.fillRect(x-5,y+7,10,17);ctx.fillStyle='#d9c6ff';ctx.beginPath();ctx.arc(x+10,y+2,4,0,7);ctx.fill()}}function drawEnemies(){for(const e of enemies){if(e.dead)continue;ctx.fillStyle=e.boss?'#d93b2b':e.brute?'#b64a38':'#6db64a';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(e.x-e.r*.3,e.y-e.r*.15,2,0,7);ctx.arc(e.x+e.r*.3,e.y-e.r*.15,2,0,7);ctx.fill();ctx.fillStyle='#1a0d0d';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,5);ctx.fillStyle='#ef4f3f';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.max),5)}}function drawShots(){for(const s of shots){ctx.strokeStyle=s.type==='magic'?'#bc93ff':'#ffd36b';ctx.lineWidth=s.type==='magic'?4:2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y-8);ctx.stroke()}}function drawParts(){for(const p of parts){ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}function draw(){drawBg();drawEnemies();drawShots();drawDefenders();drawParts()}function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop)})();</script></body></html>
