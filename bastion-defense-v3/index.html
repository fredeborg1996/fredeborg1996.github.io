<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10202c"><title>Bastion Defense</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10202c;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;color:#fff;font-weight:800;text-shadow:0 2px 3px #000b;pointer-events:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:7px}.chip{background:linear-gradient(#1d2b3a,#111a25);border:1px solid #ffffff30;border-radius:14px;padding:8px 7px;text-align:center;box-shadow:0 5px 14px #0007;font-size:12px}.bar{height:7px;background:#05090d;border-radius:8px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#39c963,#7af28f)}.xp i{background:linear-gradient(90deg,#357fd8,#74b5ff)}#wave{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);background:#0a111bcc;border:1px solid #ffffff20;border-radius:14px;padding:7px 13px;font-size:15px;white-space:nowrap}#shop{position:absolute;left:0;right:0;bottom:0;pointer-events:auto;background:linear-gradient(#172331fa,#0d151efa);border-top:1px solid #ffffff2b;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);box-shadow:0 -8px 24px #0009}.counts{display:flex;justify-content:space-between;align-items:center;color:#cbd7e2;text-shadow:none;font-size:12px;margin:0 3px 7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{border:1px solid #ffffff24;border-radius:13px;min-height:62px;padding:8px 5px;background:linear-gradient(#26384a,#172433);color:#fff;font-weight:900;font-size:12px;line-height:1.15;box-shadow:inset 0 1px #ffffff1a,0 4px 10px #0006}.btn small{display:block;margin-top:5px;color:#ffd56a;font-size:10px}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}#start{grid-column:1/-1;min-height:45px;background:linear-gradient(#ffc54d,#e89b20);color:#241705;font-size:16px;border-color:#ffe08b}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#061019e8;pointer-events:auto}.card{width:min(88vw,420px);background:linear-gradient(#1d2d3d,#111b27);border:1px solid #ffffff2e;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 50px #000b}.card button{border:0;border-radius:14px;padding:14px 22px;background:linear-gradient(#ffc95d,#e9a32d);font-size:18px;font-weight:1000;color:#251803}.hidden{display:none!important}#toast{position:absolute;left:50%;top:112px;transform:translateX(-50%);background:#0b141ddd;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;font-size:13px;opacity:0;transition:.2s}#toast.show{opacity:1}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="chip">🪙 <span id="gold">120</span></div><div class="chip">BASE <span id="hpText">100/100</span><div class="bar"><i id="hpBar"></i></div></div><div class="chip">LV <span id="level">1</span><div class="bar xp"><i id="xpBar"></i></div></div></div><div id="wave">WAVE <span id="waveNo">1</span> · <span id="left">0</span> tilbage</div><div id="toast"></div><div id="shop"><div class="counts"><span>🏹 <b id="archers">1</b> skytter · 🔮 <b id="mages">0</b> magikere</span><span>Køb under wave</span></div><div class="grid"><button class="btn" id="buyA">🏹 Ny skytte<small><span id="costA">50</span> guld</small></button><button class="btn" id="buyM">🔮 Ny magiker<small><span id="costM">130</span> guld</small></button><button class="btn" id="upD">⚔️ Skade +25%<small><span id="costD">80</span> guld</small></button><button class="btn" id="upR">⚡ Tempo +15%<small><span id="costR">100</span> guld</small></button><button class="btn" id="repair">🛠 Reparer<small><span id="costRepair">40</span> guld</small></button><button class="btn" id="fortify">🧱 Mere base-HP<small><span id="costF">120</span> guld</small></button><button class="btn" id="start">Start wave</button></div></div><div id="intro" class="overlay"><div class="card"><h1>BASTION DEFENSE</h1><p>Forsvar muren mod bølger af gobliner. Køb flere skytter, magikere og opgraderinger.</p><button id="play">Start spil</button></div></div><div id="gameover" class="overlay hidden"><div class="card"><h1>BASEN FALDT</h1><p>Du nåede wave <span id="finalWave">1</span>.</p><button onclick="location.reload()">Start forfra</button></div></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),E=id=>document.getElementById(id);let W=0,H=0,D=1,shopH=210,last=0;let gold=120,wave=1,level=1,xp=0,xpNeed=100,hp=100,maxHp=100,arch=1,mage=0,damage=1,rate=1;let enemies=[],shots=[],parts=[],active=false,spawnLeft=0,spawnT=0;let costA=50,costM=130,costD=80,costR=100,costRepair=40,costF=120;const clockA=[],clockM=[],rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const wallY=()=>Math.min(H-shopH-95,H*.62);function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;shopH=E('shop').offsetHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);setTimeout(resize,0);function toast(s){let t=E('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),900)}function hud(){E('gold').textContent=Math.floor(gold);E('hpText').textContent=Math.ceil(hp)+'/'+maxHp;E('hpBar').style.width=clamp(hp/maxHp*100,0,100)+'%';E('level').textContent=level;E('xpBar').style.width=clamp(xp/xpNeed*100,0,100)+'%';E('waveNo').textContent=wave;E('left').textContent=enemies.filter(e=>!e.dead).length+spawnLeft;E('archers').textContent=arch;E('mages').textContent=mage;E('costA').textContent=costA;E('costM').textContent=costM;E('costD').textContent=costD;E('costR').textContent=costR;E('costRepair').textContent=costRepair;E('costF').textContent=costF;E('start').disabled=active;E('start').textContent=active?'Wave i gang...':'Start wave'}function buy(cost,fn,name){if(gold<cost){toast('Ikke nok guld');return}gold-=cost;fn();toast(name+' købt');hud()}E('buyA').onclick=()=>buy(costA,()=>{arch++;costA=Math.ceil(costA*1.32)},'Skytte');E('buyM').onclick=()=>buy(costM,()=>{mage++;costM=Math.ceil(costM*1.42)},'Magiker');E('upD').onclick=()=>buy(costD,()=>{damage*=1.25;costD=Math.ceil(costD*1.48)},'Skade');E('upR').onclick=()=>buy(costR,()=>{rate*=1.15;costR=Math.ceil(costR*1.48)},'Tempo');E('repair').onclick=()=>{if(hp>=maxHp){toast('Basen har fuldt liv');return}buy(costRepair,()=>{hp=Math.min(maxHp,hp+35);costRepair=Math.ceil(costRepair*1.16)},'Reparation')};E('fortify').onclick=()=>buy(costF,()=>{maxHp+=35;hp+=35;costF=Math.ceil(costF*1.5)},'Forstærkning');E('start').onclick=()=>{if(active)return;active=true;spawnLeft=8+wave*4;spawnT=.15;hud()};E('play').onclick=()=>E('intro').classList.add('hidden');function spawn(){const boss=wave%5===0&&spawnLeft===1,brute=Math.random()<Math.min(.12+wave*.012,.38);let eh=(20+wave*8)*rnd(.85,1.15),speed=18+wave*1.25,reward=8+wave*2,r=12;if(brute){eh*=2.7;speed*=.62;reward*=2.3;r=18}if(boss){eh*=8;speed*=.5;reward*=8;r=29}enemies.push({x:rnd(35,W-35),y:-35,hp:eh,max:eh,speed,reward,r,boss,brute,dead:false,attack:0,phase:rnd(0,6.28)})}function gain(v){xp+=v;while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.ceil(xpNeed*1.28);damage*=1.08;maxHp+=10;hp=Math.min(maxHp,hp+15);toast('LEVEL '+level+'!')}}function target(){let t=null,b=-1;for(const e of enemies)if(!e.dead&&e.y>b){b=e.y;t=e}return t}function fire(dt){const t=target();if(!t)return;const y=wallY()-42;for(let i=0;i<arch;i++){clockA[i]=(clockA[i]||0)-dt;if(clockA[i]<=0){shots.push({x:(i+1)*W/(arch+1),y,tx:t.x,ty:t.y,v:460,d:12*damage,type:'a',target:t});clockA[i]=1/(1.2*rate)}}for(let i=0;i<mage;i++){clockM[i]=(clockM[i]||0)-dt;if(clockM[i]<=0){shots.push({x:(i+1)*W/(mage+1),y:y-35,tx:t.x,ty:t.y,v:330,d:28*damage,type:'m',target:t,splash:42});clockM[i]=1/(.55*rate)}}}function burst(px,py,col,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:rnd(-80,80),vy:rnd(-110,20),l:rnd(.25,.6),r:rnd(2,5),c:col})}function hit(s){if(!s.target||s.target.dead)return;s.target.hp-=s.d;if(s.splash)for(const e of enemies)if(!e.dead&&Math.hypot(e.x-s.target.x,e.y-s.target.y)<s.splash)e.hp-=s.d*.45;burst(s.target.x,s.target.y,s.type==='m'?'#c078ff':'#ffd66d',8)}function update(dt){if(active){spawnT-=dt;if(spawnLeft>0&&spawnT<=0){spawn();spawnLeft--;spawnT=Math.max(.18,.6-wave*.014)}fire(dt);for(const e of enemies){if(e.dead)continue;e.phase+=dt*5;if(e.y<wallY()-26)e.y+=e.speed*dt;else{e.attack-=dt;if(e.attack<=0){hp-=e.boss?12:e.brute?6:3;e.attack=.65;burst(e.x,wallY()-10,'#ff604e',10);if(hp<=0){hp=0;active=false;E('finalWave').textContent=wave;E('gameover').classList.remove('hidden')}}}if(e.hp<=0){e.dead=true;gold+=e.reward;gain(e.boss?60:e.brute?22:8);burst(e.x,e.y,'#79df68',14)}}for(const s of shots){if(!s.target||s.target.dead){s.dead=true;continue}const dx=s.target.x-s.x,dy=s.target.y-s.y,d=Math.hypot(dx,dy),st=s.v*dt;if(d<=st){hit(s);s.dead=true}else{s.x+=dx/d*st;s.y+=dy/d*st}}shots=shots.filter(s=>!s.dead);if(spawnLeft===0&&enemies.every(e=>e.dead)&&active){active=false;gold+=25+wave*8;wave++;hp=Math.min(maxHp,hp+10);toast('Wave klaret!')}}for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt}parts=parts.filter(p=>p.l>0);hud()}function round(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r)}function bg(){let g=x.createLinearGradient(0,0,0,wallY());g.addColorStop(0,'#152a32');g.addColorStop(.55,'#315545');g.addColorStop(1,'#6d7042');x.fillStyle=g;x.fillRect(0,0,W,wallY());x.fillStyle='#46653d';for(let i=0;i<18;i++){x.beginPath();x.arc((i*79)%W,(i*53)%Math.max(100,wallY()-120),18+i%4*4,0,7);x.fill()}x.fillStyle='#8c704d';x.beginPath();x.moveTo(W*.37,0);x.lineTo(W*.63,0);x.lineTo(W*.72,wallY());x.lineTo(W*.28,wallY());x.closePath();x.fill();x.fillStyle='#5a4538';x.fillRect(0,wallY(),W,H-wallY());x.fillStyle='#596574';x.fillRect(0,wallY()-28,W,38);for(let xx=0;xx<W;xx+=42){x.fillStyle=xx%84===0?'#89939e':'#68727d';x.fillRect(xx,wallY()-58,28,33);x.strokeStyle='#3d4650';x.strokeRect(xx,wallY()-58,28,33)}}function defenders(){for(let i=0;i<arch;i++){const px=(i+1)*W/(arch+1),py=wallY()-48;x.fillStyle='#324d2f';x.beginPath();x.arc(px,py,11,0,7);x.fill();x.fillStyle='#c7a26b';x.beginPath();x.arc(px,py-2,6,0,7);x.fill();x.strokeStyle='#e3bd70';x.lineWidth=2;x.beginPath();x.arc(px+9,py+5,10,-1.2,1.2);x.stroke()}for(let i=0;i<mage;i++){const px=(i+1)*W/(mage+1),py=wallY()-83;x.fillStyle='#5c3aa4';x.beginPath();x.arc(px,py,12,0,7);x.fill();x.fillStyle='#d8c8ff';x.beginPath();x.arc(px+11,py-1,5,0,7);x.fill()}}function monsters(){for(const e of enemies){if(e.dead)continue;const bob=Math.sin(e.phase)*2,py=e.y+bob;x.save();x.shadowColor='#0006';x.shadowBlur=8;x.shadowOffsetY=5;x.fillStyle=e.boss?'#93422d':e.brute?'#874e32':'#5aa33e';x.beginPath();x.ellipse(e.x,py,e.r,e.r*.86,0,0,7);x.fill();x.shadowColor='transparent';x.fillStyle='#d9e08d';x.beginPath();x.arc(e.x-e.r*.3,py-e.r*.18,2.2,0,7);x.arc(e.x+e.r*.3,py-e.r*.18,2.2,0,7);x.fill();x.fillStyle='#2a170f';x.fillRect(e.x-e.r,py-e.r-10,e.r*2,6);x.fillStyle='#ef4f3f';x.fillRect(e.x-e.r,py-e.r-10,e.r*2*Math.max(0,e.hp/e.max),6);x.restore()}}function draw(){bg();monsters();for(const s of shots){x.fillStyle=s.type==='m'?'#cb92ff':'#ffd56c';x.beginPath();x.arc(s.x,s.y,s.type==='m'?5:3,0,7);x.fill()}defenders();for(const p of parts){x.globalAlpha=Math.max(0,p.l*2);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1}function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop)})();</script></body></html>
