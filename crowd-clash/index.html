<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#edb36a"><title>Mob Control Run</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edb36a;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:1000;text-shadow:0 2px 4px #000b}.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;justify-content:space-between}.pill{background:#111b;border:2px solid #ffffff66;border-radius:16px;padding:7px 11px;min-width:82px;text-align:center}#level{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);font-size:22px}#bar{position:absolute;top:calc(env(safe-area-inset-top) + 45px);left:18%;right:18%;height:12px;background:#111c;border:2px solid #ffffff66;border-radius:9px;overflow:hidden}#fill{height:100%;width:0;background:#62df4e}#panel{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:90%;text-align:center;font-size:37px;line-height:1.05}#panel small{display:block;font-size:16px;margin:12px auto;max-width:340px}button{pointer-events:auto;border:0;border-radius:16px;padding:14px 23px;background:#fff;color:#222;font-size:19px;font-weight:1000;box-shadow:0 7px 18px #0005}#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 17px);left:50%;transform:translateX(-50%);background:#111b;border-radius:15px;padding:9px 14px;font-size:14px;white-space:nowrap}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="pill">💎 <span id="gems">0</span></div><div class="pill">👥 <span id="count">12</span></div></div><div id="level">LEVEL 1</div><div id="bar"><div id="fill"></div></div><div id="panel"><div id="title">MOB CONTROL RUN</div><small id="sub">Træk gruppen til siden. Tag de bedste porte og slå fjenderne i direkte kamp.</small><button id="go">Start</button></div><div id="hint">Træk til venstre og højre</div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),E=id=>document.getElementById(id),count=E('count'),gemsE=E('gems'),fill=E('fill'),levelE=E('level'),panel=E('panel'),title=E('title'),sub=E('sub'),go=E('go'),hint=E('hint');let W,H,D=1,L,R,T,last=0,drag=false,run=false,end=false,level=1,maxLevel=12,px=0,tx=0,wy=0,speed=160,crowd=12,gems=0,finish=4300,objs=[],parts=[],stairs=[],fight=null,finishMode=false,stairIndex=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),sy=y=>H-(y-wy)+45;function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);T=Math.min(W*.78,430);L=(W-T)/2;R=L+T;if(!px)px=tx=W/2}addEventListener('resize',resize);resize();function hud(){count.textContent=Math.max(0,Math.floor(crowd));gemsE.textContent=gems;fill.style.width=Math.min(100,wy/finish*100)+'%';levelE.textContent='LEVEL '+level}function make(){objs=[];parts=[];stairs=[];fight=null;finishMode=false;stairIndex=0;wy=0;speed=155+level*4;crowd=10+level*2;px=tx=W/2;finish=4300;const xs=[L+T*.27,L+T*.73],scale=1+(level-1)*.19;let y=450;const rows=[[{t:'add',v:8+level},{t:'mult',v:2}],[{t:'enemy',v:Math.round(18*scale)}],[{t:'add',v:10+level*2},{t:'add',v:4+level}],[{t:'boss',v:Math.round(35*scale)}],[{t:'mult',v:2},{t:'add',v:16+level*2}],[{t:'enemy',v:Math.round(52*scale)}],[{t:'add',v:22+level*2},{t:'mult',v:3}],[{t:'boss',v:Math.round(85*scale)}],[{t:'mult',v:2},{t:'add',v:30+level*3}],[{t:'enemy',v:Math.round(120*scale)}]];rows.forEach(row=>{if(row.length===1)objs.push({x:W/2,y,t:row[0].t,v:row[0].v,hp:row[0].v,done:false});else row.forEach((o,i)=>objs.push({x:xs[i],y,t:o.t,v:o.v,done:false}));y+=335});const start=3850;for(let i=0;i<15;i++)stairs.push({y:start+i*60,m:i+2,done:false});hud()}function start(){if(end)return;run=true;panel.style.display='none';hint.style.display='none'}go.onclick=()=>{if(end){if(level<maxLevel)level++;else level=1;end=false;make()}start()};function down(e){drag=true;tx=e.touches?e.touches[0].clientX:e.clientX;start()}function move(e){if(drag){e.preventDefault();tx=e.touches?e.touches[0].clientX:e.clientX}}function up(){drag=false}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);addEventListener('pointerup',up);c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);function burst(a,b,col,n=18){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:rnd(-110,110),vy:rnd(-140,20),l:rnd(.3,.75),r:rnd(2,5),c:col})}function lose(){run=false;end=true;panel.style.display='block';title.textContent='TABT';sub.textContent='Du løb tør for folk. Vælg bedre porte.';go.textContent='Prøv igen'}function win(mult){run=false;end=true;gems+=Math.floor(crowd*mult/8)+level*5;panel.style.display='block';title.textContent=level===maxLevel?'ALLE LEVELS KLARE!':'LEVEL KLARET';sub.textContent='Slutmultiplier: x'+mult+' · '+Math.floor(crowd)+' personer tilbage.';go.textContent=level===maxLevel?'Start forfra':'Næste level';hud()}function touchGate(o){if(o.done||fight)return;const yy=sy(o.y);if(Math.abs(yy-(H-155))<43&&Math.abs(px-o.x)<T*.26){o.done=true;if(o.t==='add')crowd+=o.v;else if(o.t==='mult')crowd*=o.v;burst(o.x,yy,o.t==='add'?'#35bbff':'#a14cff',24);hud()}}function beginFight(o){if(o.done||fight)return;const yy=sy(o.y);if(Math.abs(yy-(H-170))<78&&Math.abs(px-o.x)<T*.33){fight=o;speed=0}}function updateFight(dt){if(!fight)return;const power=Math.max(7,crowd*.58);fight.hp-=power*dt;crowd-=Math.max(1.5,fight.v*.018)*dt;if(Math.random()<dt*18)burst((px+fight.x)/2,H-200,'#fff28a',2);if(crowd<=0){crowd=0;lose();fight=null;return}if(fight.hp<=0){fight.done=true;gems+=Math.ceil(fight.v/8);burst(fight.x,sy(fight.y),'#ff443a',42);fight=null;speed=155+level*4}hud()}function update(dt){if(run&&!end){if(!finishMode){wy+=speed*dt;px+=(tx-px)*Math.min(1,dt*10);px=clamp(px,L+28,R-28);for(const o of objs){if(o.t==='add'||o.t==='mult')touchGate(o);else beginFight(o)}updateFight(dt);if(wy>3700&&!fight){finishMode=true;speed=130}}else{wy+=speed*dt;const next=stairs[stairIndex];if(next&&sy(next.y)<H-145){next.done=true;stairIndex++;crowd=Math.max(1,crowd-1);burst(px,H-155,'#8b57ff',6);hud()}if(stairIndex>=stairs.length||crowd<=1)win(Math.max(2,stairIndex+1))}hud()}for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=270*dt}parts=parts.filter(p=>p.l>0)}function bg(){x.fillStyle='#efb66d';x.fillRect(0,0,W,H);x.fillStyle='#d69a55';for(let i=0;i<25;i++){let yy=(i*137-wy*.24)%H;if(yy<0)yy+=H;x.beginPath();x.arc((i*91+wy*.06)%W,yy,3+i%4,0,7);x.fill()}x.fillStyle='#d9d1ca';rr(L-10,0,T+20,H,26);x.fill();let g=x.createLinearGradient(L,0,R,0);g.addColorStop(0,'#807c78');g.addColorStop(.5,'#a9a39e');g.addColorStop(1,'#807c78');x.fillStyle=g;rr(L,0,T,H,22);x.fill()}function gate(o){const yy=sy(o.y);if(yy<-90||yy>H+90||o.done)return;const w=T*.36,h=66;x.save();x.shadowColor='#0005';x.shadowBlur=10;x.fillStyle=o.t==='add'?'#2aaeea':'#8b39dc';rr(o.x-w/2,yy-h/2,w,h,8);x.fill();x.fillStyle='#ffffff25';x.fillRect(o.x-w/2+7,yy-h/2+7,w-14,10);x.fillStyle='#fff';x.strokeStyle='#222';x.lineWidth=4;x.font='1000 28px system-ui';x.textAlign='center';x.textBaseline='middle';const s=o.t==='add'?`+${o.v}`:`x${o.v}`;x.strokeText(s,o.x,yy);x.fillText(s,o.x,yy);x.restore()}function enemy(o){const yy=sy(o.y);if(yy<-140||yy>H+140||o.done)return;const boss=o.t==='boss',r=boss?56:39,n=Math.min(70,10+Math.floor(o.v/3));x.save();x.fillStyle='#dc302b';for(let i=0;i<n;i++){const a=i*2.399,sp=Math.sqrt(i)*5.2;x.beginPath();x.arc(o.x+Math.cos(a)*sp,yy+Math.sin(a)*sp,7,0,7);x.fill()}if(boss){x.fillStyle='#ffd429';x.beginPath();x.ellipse(o.x,yy-r*.08,r*.68,r*.43,0,0,7);x.fill();x.fillStyle='#8c1414';x.font='1000 12px system-ui';x.textAlign='center';x.fillText('BOSS',o.x,yy-r*.08+4)}const hp=Math.max(0,Math.ceil(o.hp));x.fillStyle='#2d0909';rr(o.x-50,yy-r-39,100,31,8);x.fill();x.fillStyle='#e82e26';rr(o.x-47,yy-r-36,94*(hp/o.v),25,6);x.fill();x.fillStyle='#fff';x.font='1000 17px system-ui';x.textAlign='center';x.fillText(hp,o.x,yy-r-18);x.restore()}function stair(s){const yy=sy(s.y);if(yy<-80||yy>H+80||s.done)return;const w=T*.55,h=48;x.fillStyle='#8a37d2';rr(W/2-w/2,yy-h/2,w,h,5);x.fill();x.fillStyle='#fff';x.strokeStyle='#222';x.lineWidth=4;x.font='1000 24px system-ui';x.textAlign='center';x.strokeText('x'+s.m,W/2,yy+8);x.fillText('x'+s.m,W/2,yy+8)}function crowdDraw(){const by=H-155,n=Math.min(115,Math.max(1,Math.floor(crowd)));for(let i=n-1;i>=0;i--){const a=i*2.399,sp=Math.min(T*.27,10+Math.sqrt(i)*8.7),xx=px+Math.cos(a)*sp,yy=by+Math.sin(a)*sp*.48;x.fillStyle='#45c4ff';x.beginPath();x.arc(xx,yy-7,5.4,0,7);x.fill();x.fillRect(xx-3.4,yy-2,6.8,11)}x.save();x.globalAlpha=.24;x.fillStyle='#38bdff';x.beginPath();x.arc(px,by,54,0,7);x.fill();x.restore()}function draw(){bg();[...objs].sort((a,b)=>b.y-a.y).forEach(o=>(o.t==='enemy'||o.t==='boss')?enemy(o):gate(o));stairs.forEach(stair);crowdDraw();for(const p of parts){x.globalAlpha=Math.max(0,p.l*1.7);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1}function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}make();requestAnimationFrame(loop)})();</script></body></html>
