<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e9a75c"><title>Crowd Clash</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9a75c;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 4px #000a}.top{position:absolute;top:calc(env(safe-area-inset-top) + 9px);left:10px;right:10px;display:flex;justify-content:space-between}.pill{background:#111b;border:2px solid #ffffff55;border-radius:16px;padding:7px 10px;min-width:78px;text-align:center}#level{position:absolute;top:calc(env(safe-area-inset-top) + 11px);left:50%;transform:translateX(-50%);font-size:21px}#bar{position:absolute;top:calc(env(safe-area-inset-top) + 45px);left:18%;right:18%;height:12px;background:#111b;border:2px solid #ffffff55;border-radius:8px;overflow:hidden}#fill{height:100%;background:#62df4e;width:0}#panel{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:90%;text-align:center;font-size:36px;line-height:1.05}#panel small{display:block;font-size:16px;margin:12px auto;max-width:330px}button{pointer-events:auto;border:0;border-radius:16px;padding:13px 20px;margin:7px;background:#fff;color:#222;font-size:18px;font-weight:900;box-shadow:0 6px 16px #0004}#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);background:#111b;border-radius:15px;padding:9px 14px;font-size:14px;white-space:nowrap}#stats{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:10px;background:#1119;border-radius:13px;padding:7px 9px;font-size:13px;line-height:1.45}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="pill">💎 <span id="gems">0</span></div><div class="pill">👥 <span id="count">12</span></div></div><div id="level">LEVEL 1</div><div id="bar"><div id="fill"></div></div><div id="stats">🔫 Skade <span id="dmg">1</span><br>⚡ Tempo <span id="rate">1.0</span></div><div id="panel"><div id="title">CROWD CLASH</div><small id="sub">Træk til siderne. Din gruppe skyder automatisk. Tag porte og opgraderinger.</small><button id="go">Start</button></div><div id="hint">Træk til venstre og højre</div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),E=id=>document.getElementById(id),count=E('count'),gemsE=E('gems'),dmgE=E('dmg'),rateE=E('rate'),fill=E('fill'),levelE=E('level'),panel=E('panel'),title=E('title'),sub=E('sub'),go=E('go'),hint=E('hint');let W,H,D=1,L,R,T,last=0,drag=false,run=false,end=false,level=1,maxLevel=8,px=0,tx=0,wy=0,speed=150,crowd=12,gems=0,damage=1,fireRate=1,shotClock=0,finish=3800,objs=[],shots=[],parts=[];const cfg=[{base:12,m:[18,28,40,55]},{base:14,m:[22,34,48,70]},{base:16,m:[28,42,62,85]},{base:18,m:[34,55,78,110]},{base:20,m:[42,65,95,135]},{base:22,m:[50,78,115,165]},{base:25,m:[62,95,140,205]},{base:28,m:[75,115,170,250]}];function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);T=Math.min(W*.76,430);L=(W-T)/2;R=L+T;if(!px)px=tx=W/2}addEventListener('resize',rs);rs();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sy=y=>H-(y-wy)+40,rnd=(a,b)=>a+Math.random()*(b-a);function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}function setHUD(){count.textContent=Math.max(0,Math.floor(crowd));gemsE.textContent=gems;dmgE.textContent=damage.toFixed(1);rateE.textContent=fireRate.toFixed(1);fill.style.width=Math.min(100,wy/finish*100)+'%';levelE.textContent='LEVEL '+level}function build(){objs=[];shots=[];parts=[];wy=0;speed=150+level*5;crowd=cfg[level-1].base;damage=1+(level-1)*.2;fireRate=1+(level-1)*.05;px=tx=W/2;finish=3900;const xs=[L+T*.27,L+T*.73];let y=470;const enemies=cfg[level-1].m;const rows=[[{t:'add',v:6+level*2},{t:'mult',v:2}],[{t:'enemy',v:enemies[0]}],[{t:'damage',v:.5},{t:'rate',v:.25}],[{t:'enemy',v:enemies[1]}],[{t:'add',v:12+level*3},{t:'mult',v:2}],[{t:'enemy',v:enemies[2]}],[{t:'damage',v:1},{t:'rate',v:.35}],[{t:'enemy',v:enemies[3]}],[{t:'mult',v:3},{t:'add',v:25+level*4}]];rows.forEach(row=>{if(row.length===1)objs.push({x:W/2,y,t:row[0].t,v:row[0].v,hp:row[0].v,done:false});else row.forEach((o,i)=>objs.push({x:xs[i],y,t:o.t,v:o.v,done:false}));y+=330});objs.push({x:W/2,y:finish,t:'boss',v:Math.round(enemies[3]*1.55),hp:Math.round(enemies[3]*1.55),done:false});setHUD()}function start(){run=true;end=false;panel.style.display='none';hint.style.display='none'}function startLevel(){build();start()}go.onclick=()=>{if(end&&level<maxLevel)level++;else if(end&&level>=maxLevel)level=1;startLevel()};function down(e){drag=true;tx=e.touches?e.touches[0].clientX:e.clientX;if(!run&&!end)start()}function move(e){if(drag){e.preventDefault();tx=e.touches?e.touches[0].clientX:e.clientX}}function up(){drag=false}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);addEventListener('pointerup',up);c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);function burst(a,b,col,n=16){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:rnd(-100,100),vy:rnd(-130,20),l:rnd(.3,.7),r:rnd(2,5),c:col})}function nearest(){let best=null,bd=1e9;for(const o of objs){if((o.t==='enemy'||o.t==='boss')&&!o.done){const yy=sy(o.y),d=Math.abs(yy-(H-150));if(yy>-80&&yy<H-170&&d<bd){bd=d;best=o}}}return best}function shoot(){const o=nearest();if(!o)return;shots.push({x:px,y:H-165,tx:o.x,ty:sy(o.y),life:.45,target:o,damage:damage*Math.max(1,crowd/10)})}function win(){run=false;end=true;gems+=20+level*5;panel.style.display='block';title.textContent=level===maxLevel?'ALLE LEVELS KLARE!':'LEVEL KLARET';sub.textContent='Du sluttede med '+Math.floor(crowd)+' personer og '+gems+' diamanter.';go.textContent=level===maxLevel?'Start forfra':'Næste level';setHUD()}function lose(){run=false;end=true;panel.style.display='block';title.textContent='TABT';sub.textContent='Opgrader skade, skudhastighed eller gruppens størrelse.';go.textContent='Prøv igen'}function collide(o){if(o.done)return;const yy=sy(o.y);if(Math.abs(yy-(H-150))<40&&Math.abs(px-o.x)<T*.26){if(o.t==='add'){crowd+=o.v;o.done=true;burst(o.x,yy,'#4bc8ff',20)}else if(o.t==='mult'){crowd*=o.v;o.done=true;burst(o.x,yy,'#a64cff',24)}else if(o.t==='damage'){damage+=o.v;o.done=true;burst(o.x,yy,'#ffd34e',22)}else if(o.t==='rate'){fireRate+=o.v;o.done=true;burst(o.x,yy,'#6bff92',22)}else if((o.t==='enemy'||o.t==='boss')&&o.hp>0){crowd-=Math.max(1,o.hp*.018);o.hp-=crowd*.012;if(crowd<=0)lose()}}}function update(dt){if(run&&!end){wy+=speed*dt;px+=(tx-px)*Math.min(1,dt*10);px=clamp(px,L+30,R-30);shotClock-=dt;if(shotClock<=0){shoot();shotClock=.36/fireRate}for(const o of objs)collide(o);for(const s of shots){s.life-=dt;const p=1-s.life/.45;s.cx=s.x+(s.tx-s.x)*p;s.cy=s.y+(s.ty-s.y)*p;if(s.life<=0&&!s.hit){s.hit=true;if(s.target&&!s.target.done){s.target.hp-=s.damage;burst(s.tx,s.ty,'#ffe266',5);if(s.target.hp<=0){s.target.done=true;gems+=Math.ceil(s.target.v/7);burst(s.target.x,sy(s.target.y),'#ff4b40',32);if(s.target.t==='boss')win()}}}}shots=shots.filter(s=>s.life>0);setHUD()}for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt}parts=parts.filter(p=>p.l>0)}function bg(){x.fillStyle='#efb66d';x.fillRect(0,0,W,H);x.fillStyle='#d49a57';for(let i=0;i<22;i++){let yy=(i*139-wy*.25)%H;if(yy<0)yy+=H;x.beginPath();x.arc((i*89+wy*.07)%W,yy,3+i%4,0,7);x.fill()}x.fillStyle='#d7d0c8';rr(L-10,0,T+20,H,26);x.fill();let g=x.createLinearGradient(L,0,R,0);g.addColorStop(0,'#85817d');g.addColorStop(.5,'#aaa49f');g.addColorStop(1,'#85817d');x.fillStyle=g;rr(L,0,T,H,22);x.fill()}function gate(o){let yy=sy(o.y);if(yy<-90||yy>H+90||o.done)return;let w=T*.35,h=65,col='#2ea9ea',txt='+'+o.v;if(o.t==='mult'){col='#8b39d8';txt='x'+o.v}if(o.t==='damage'){col='#e8a51a';txt='SKADE +'+o.v}if(o.t==='rate'){col='#2dbd64';txt='TEMPO +'+o.v}x.save();x.shadowColor='#0005';x.shadowBlur=9;x.fillStyle=col;rr(o.x-w/2,yy-h/2,w,h,9);x.fill();x.shadowColor='transparent';x.fillStyle='#fff';x.strokeStyle='#222';x.lineWidth=4;x.font='900 '+(txt.length>7?17:27)+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.strokeText(txt,o.x,yy);x.fillText(txt,o.x,yy);x.restore()}function enemy(o){let yy=sy(o.y);if(yy<-130||yy>H+130||o.done)return;let r=o.t==='boss'?54:38;x.save();x.fillStyle=o.t==='boss'?'#b81818':'#db342e';for(let i=0;i<Math.min(55,10+Math.floor(o.v/4));i++){let a=i*2.4,rrr=Math.sqrt(i)*5.4;x.beginPath();x.arc(o.x+Math.cos(a)*rrr,yy+Math.sin(a)*rrr,7,0,7);x.fill()}x.fillStyle='#ffd52f';x.beginPath();x.arc(o.x,yy-r*.2,r*.5,0,7);x.fill();x.fillStyle='#241515';x.font='900 13px system-ui';x.textAlign='center';x.fillText(o.t==='boss'?'BOSS':'ENEMY',o.x,yy-r*.2+4);let hp=Math.max(0,Math.ceil(o.hp));x.fillStyle='#401010';rr(o.x-48,yy-r-36,96,30,9);x.fill();x.fillStyle='#e62b22';rr(o.x-45,yy-r-33,90*(hp/o.v),24,7);x.fill();x.fillStyle='#fff';x.font='900 16px system-ui';x.fillText(hp,o.x,yy-r-17);x.restore()}function crowdDraw(){let by=H-150,n=Math.min(95,Math.max(1,Math.floor(crowd)));for(let i=n-1;i>=0;i--){let a=i*2.399,s=Math.min(T*.26,10+Math.sqrt(i)*9),xx=px+Math.cos(a)*s,yy=by+Math.sin(a)*s*.48;x.fillStyle='#49c5ff';x.beginPath();x.arc(xx,yy-7,5.5,0,7);x.fill();x.fillRect(xx-3.5,yy-2,7,11)}x.fillStyle='#ffcf2e';x.fillRect(px-3,by-31,6,20)}function draw(){bg();[...objs].sort((a,b)=>b.y-a.y).forEach(o=>o.t==='enemy'||o.t==='boss'?enemy(o):gate(o));for(const s of shots){x.strokeStyle='#ffe75c';x.lineWidth=4;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.cx||s.x,s.cy||s.y);x.stroke();x.fillStyle='#fff28a';x.beginPath();x.arc(s.cx||s.x,s.cy||s.y,4,0,7);x.fill()}crowdDraw();for(const p of parts){x.globalAlpha=Math.max(0,p.l*1.7);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}build();requestAnimationFrame(loop)})();</script></body></html>
