<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#16131f"><title>Bastion Defense</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15111d;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;color:#fff;font-weight:800;pointer-events:none;text-shadow:0 2px 4px #000c}.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px}.pill{background:#171421dd;border:1px solid #ffffff2f;border-radius:13px;padding:7px 9px;min-width:78px;text-align:center;font-size:14px}.center{position:absolute;top:calc(env(safe-area-inset-top) + 9px);left:50%;transform:translateX(-50%);font-size:18px;white-space:nowrap}.bars{position:absolute;top:calc(env(safe-area-inset-top) + 46px);left:10px;right:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:16px;background:#0c0b11dd;border:1px solid #ffffff30;border-radius:8px;overflow:hidden;position:relative}.bar span{display:block;height:100%;width:100%}.bar label{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px}.hp span{background:#d94b4b}.xp span{background:#4a9fe8}.controls{position:absolute;left:7px;right:7px;bottom:calc(env(safe-area-inset-bottom) + 7px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px;pointer-events:auto}.btn{border:1px solid #ffffff2e;border-radius:14px;background:linear-gradient(#312941,#1c1826);color:#fff;padding:10px 5px 8px;min-height:62px;font-weight:900;font-size:12px;box-shadow:0 5px 12px #0007}.btn strong{display:block;font-size:16px;margin-bottom:2px}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}.wave{grid-column:1/-1;background:linear-gradient(#b34c31,#712817);font-size:17px;min-height:49px}.overlay{position:absolute;inset:0;background:#09070dbb;display:flex;align-items:center;justify-content:center;pointer-events:auto}.card{width:min(90vw,390px);background:#211b2b;border:1px solid #ffffff25;border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 50px #000a}.card h1{margin:0 0 10px;font-size:31px}.card p{margin:7px 0 18px;color:#d8d0e4;font-weight:600;line-height:1.35}.card button{border:0;border-radius:14px;background:#ef8f38;color:#25140b;padding:14px 24px;font-size:18px;font-weight:1000}.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#111c;border:1px solid #ffffff33;border-radius:13px;padding:9px 13px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="pill">🪙 <span id="gold">100</span></div><div class="pill">💀 <span id="kills">0</span></div></div><div class="center">BØLGE <span id="waveNo">1</span></div><div class="bars"><div class="bar hp"><span id="hpFill"></span><label>BASE <b id="hpText">100/100</b></label></div><div class="bar xp"><span id="xpFill"></span><label>LEVEL <b id="level">1</b></label></div></div><div class="toast" id="toast"></div><div class="controls"><button class="btn" id="buy"><strong>🏹 + SKYTTE</strong><span id="buyCost">50</span> guld</button><button class="btn" id="damage"><strong>💥 SKADE</strong><span id="damageCost">60</span> guld</button><button class="btn" id="rate"><strong>⚡ TEMPO</strong><span id="rateCost">70</span> guld</button><button class="btn" id="repair"><strong>🧱 REPARER</strong><span id="repairCost">40</span> guld</button><button class="btn" id="wall"><strong>🏰 BASE HP</strong><span id="wallCost">90</span> guld</button><button class="btn" id="special"><strong>🔥 SALVE</strong><span id="specialText">KLAR</span></button><button class="btn wave" id="startWave">START BØLGE 1</button></div><div class="overlay" id="overlay"><div class="card"><h1>BASTION DEFENSE</h1><p>Forsvar muren mod voksende horder. Køb skytter, opgrader våben og byg basen stærkere mellem bølgerne.</p><button id="play">Start spil</button></div></div></div><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D,last=0,playing=false,waveActive=false,wave=1,gold=100,kills=0,level=1,xp=0,xpNeed=100,baseHP=100,maxHP=100,shooters=1,damage=9,fireRate=1.2,buyCost=50,damageCost=60,rateCost=70,repairCost=40,wallCost=90,special=0,enemies=[],bullets=[],parts=[],spawnLeft=0,spawnClock=0,between=true;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function hud(){$('gold').textContent=Math.floor(gold);$('kills').textContent=kills;$('waveNo').textContent=wave;$('level').textContent=level;$('hpText').textContent=Math.ceil(baseHP)+'/'+maxHP;$('hpFill').style.width=100*baseHP/maxHP+'%';$('xpFill').style.width=100*xp/xpNeed+'%';$('buyCost').textContent=buyCost;$('damageCost').textContent=damageCost;$('rateCost').textContent=rateCost;$('repairCost').textContent=repairCost;$('wallCost').textContent=wallCost;$('specialText').textContent=special<=0?'KLAR':Math.ceil(special)+'s';$('startWave').textContent=waveActive?'BØLGE I GANG':'START BØLGE '+wave;['buy','damage','rate','repair','wall'].forEach(id=>$(id).disabled=waveActive)}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),900)}function spend(cost,fn){if(waveActive)return;if(gold<cost){toast('Ikke nok guld');return}gold-=cost;fn();hud()}$('buy').onclick=()=>spend(buyCost,()=>{shooters++;buyCost=Math.round(buyCost*1.45);toast('Ny skytte')});$('damage').onclick=()=>spend(damageCost,()=>{damage*=1.28;damageCost=Math.round(damageCost*1.5);toast('Skade opgraderet')});$('rate').onclick=()=>spend(rateCost,()=>{fireRate*=1.22;rateCost=Math.round(rateCost*1.52);toast('Skudhastighed opgraderet')});$('repair').onclick=()=>spend(repairCost,()=>{baseHP=Math.min(maxHP,baseHP+35);repairCost=Math.round(repairCost*1.18);toast('Basen repareret')});$('wall').onclick=()=>spend(wallCost,()=>{maxHP+=50;baseHP+=50;wallCost=Math.round(wallCost*1.55);toast('Basen forstærket')});$('special').onclick=()=>{if(special>0||!waveActive)return;special=18;enemies.forEach(e=>e.hp-=damage*6);burst(W/2,H*.55,'#ffb64a',65);toast('Ildsalve!')};$('startWave').onclick=()=>{if(!playing||waveActive)return;startWave()};$('play').onclick=()=>{$('overlay').style.display='none';playing=true;hud()};function startWave(){waveActive=true;between=false;spawnLeft=10+wave*4;spawnClock=.1;hud()}function spawnEnemy(){const boss=wave%5===0&&spawnLeft===1,brute=Math.random()<Math.min(.35,wave*.025);const hp=(boss?240:brute?75:32)*Math.pow(1.16,wave-1),speed=(boss?20:brute?29:38)+wave*.8;enemies.push({x:rnd(W*.12,W*.88),y:-25,hp,max:hp,speed,r:boss?25:brute?18:13,type:boss?'boss':brute?'brute':'goblin',hit:0});spawnLeft--}function shooterPos(i){const gap=Math.min(45,W/(shooters+2)),start=W/2-gap*(shooters-1)/2;return{x:start+i*gap,y:H*.76}}function targetFor(s){let best=null,bestY=-1;for(const e of enemies)if(e.y>bestY){best=e;bestY=e.y}return best}function fire(){for(let i=0;i<shooters;i++){const s=shooterPos(i),t=targetFor(s);if(!t)continue;const dx=t.x-s.x,dy=t.y-s.y,len=Math.hypot(dx,dy)||1;bullets.push({x:s.x,y:s.y,vx:dx/len*520,vy:dy/len*520,life:1.6,dmg:damage,target:t})}}function gainXP(n){xp+=n;while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.round(xpNeed*1.32);damage*=1.08;maxHP+=10;baseHP=Math.min(maxHP,baseHP+10);toast('LEVEL '+level+'!')}}function kill(e){kills++;gold+=e.type==='boss'?80+wave*8:e.type==='brute'?12:5;gainXP(e.type==='boss'?45:e.type==='brute'?12:5);burst(e.x,e.y,e.type==='boss'?'#efb33c':'#75d15c',e.type==='boss'?42:14)}function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-110,110),vy:rnd(-110,50),life:rnd(.3,.8),r:rnd(2,5),c:col})}let fireClock=0;function update(dt){if(!playing)return;if(special>0)special-=dt;if(waveActive){spawnClock-=dt;if(spawnLeft>0&&spawnClock<=0){spawnEnemy();spawnClock=Math.max(.16,.62-wave*.012)}fireClock-=dt;if(fireClock<=0){fire();fireClock=1/fireRate}for(const e of enemies){e.y+=e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(e.y>H*.72){baseHP-=dt*(e.type==='boss'?35:e.type==='brute'?15:7);e.y=H*.72;e.hit=.1;if(baseHP<=0){gameOver();return}}}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=null,bd=999;for(const e of enemies){const d=Math.hypot(b.x-e.x,b.y-e.y);if(d<e.r+5&&d<bd){hit=e;bd=d}}if(hit){hit.hp-=b.dmg;hit.hit=.12;b.life=0;burst(b.x,b.y,'#ffe27a',3)}}bullets=bullets.filter(b=>b.life>0);const dead=enemies.filter(e=>e.hp<=0);dead.forEach(kill);enemies=enemies.filter(e=>e.hp>0);if(spawnLeft===0&&enemies.length===0){waveActive=false;between=true;gold+=20+wave*5;wave++;baseHP=Math.min(maxHP,baseHP+10);toast('Bølge klaret');hud()}}for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}parts=parts.filter(p=>p.life>0);hud()}function gameOver(){playing=false;waveActive=false;$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='BASTIONEN FALDT';$('overlay').querySelector('p').textContent='Du nåede bølge '+wave+' med '+kills+' drab. Tryk for at starte forfra.';$('play').textContent='Start forfra';$('play').onclick=()=>location.reload()}function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#21182e');g.addColorStop(.65,'#493448');g.addColorStop(1,'#251d25');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#34283e';for(let i=0;i<18;i++){ctx.beginPath();ctx.arc((i*73)%W,(i*113)%H*.65,2+i%4,0,7);ctx.fill()}ctx.fillStyle='#52404e';ctx.fillRect(0,H*.72,W,H*.28);ctx.fillStyle='#807081';ctx.fillRect(0,H*.735,W,18);ctx.fillStyle='#2d2330';for(let x=0;x<W;x+=34){ctx.fillRect(x,H*.69,27,44)}}function drawBase(){ctx.fillStyle='#3a303e';ctx.fillRect(0,H*.76,W,H*.24);ctx.fillStyle='#8d7b82';ctx.fillRect(0,H*.75,W,16);ctx.fillStyle='#24202a';for(let x=8;x<W;x+=44){ctx.fillRect(x,H*.73,28,22)}}function drawShooters(){for(let i=0;i<shooters;i++){const s=shooterPos(i);ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#d8c4a3';ctx.beginPath();ctx.arc(0,-13,7,0,7);ctx.fill();ctx.fillStyle=i%3===0?'#4f80cf':i%3===1?'#bd5a48':'#6aa35b';ctx.fillRect(-7,-6,14,18);ctx.strokeStyle='#c79a5b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(4,-5);ctx.lineTo(12,-17);ctx.stroke();ctx.restore()}}function drawEnemies(){for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.hit>0?'#fff':e.type==='boss'?'#b33939':e.type==='brute'?'#8b6b46':'#5fa34c';ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.fillStyle='#171318';ctx.beginPath();ctx.arc(-e.r*.32,-2,2.2,0,7);ctx.arc(e.r*.32,-2,2.2,0,7);ctx.fill();if(e.type==='boss'){ctx.fillStyle='#d5a83d';ctx.fillRect(-e.r*.7,-e.r-8,e.r*1.4,6)}ctx.fillStyle='#171318aa';rr(-e.r,e.r+6,e.r*2,5,3);ctx.fill();ctx.fillStyle='#e34b4b';rr(-e.r,e.r+6,e.r*2*(e.hp/e.max),5,3);ctx.fill();ctx.restore()}}function drawBullets(){ctx.fillStyle='#ffd966';for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,7);ctx.fill()}}function drawParts(){for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}function draw(){drawBg();drawEnemies();drawBullets();drawBase();drawShooters();drawParts()}function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop)})();</script></body></html>
